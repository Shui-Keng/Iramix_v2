name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-msvc
            engine_probe: build/windows-msvc/Debug/iramix_engine_probe.exe
          - os: macos-latest
            preset: dev
            engine_probe: build/dev/iramix_engine_probe
          - os: ubuntu-latest
            preset: dev
            engine_probe: build/dev/iramix_engine_probe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "9.6.1"

      - name: Install JACK development package and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libjack-jackd2-dev xvfb

      # L-2: the JACK licence claim in DEPENDENCIES.md came from upstream
      # reputation, not an inspected package, because this project has no
      # Linux machine (R-13). The Ubuntu runner does, so it reads the
      # actual copyright file and the actual link type. Printed, not
      # asserted: an upstream relicence should show up as a visible diff
      # in the log rather than a red build nobody can reproduce locally.
      - name: Record JACK licence and link type
        if: runner.os == 'Linux'
        run: |
          echo "--- dpkg package versions ---"
          dpkg-query -W -f='${Package} ${Version}\n' libjack-jackd2-dev libjack-jackd2-0 || true
          echo "--- declared SPDX identifiers in copyright ---"
          grep -iE '^License:' /usr/share/doc/libjack-jackd2-dev/copyright \
            | sort -u || true
          echo "--- pkg-config link flags ---"
          pkg-config --libs jack || true
          echo "--- library files shipped (.so = dynamic, .a = static) ---"
          dpkg -L libjack-jackd2-dev libjack-jackd2-0 2>/dev/null \
            | grep -E '\.(so|a)($|\.)' | sort || true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Build and test Java UI and engine handshake
        if: runner.os != 'Linux'
        run: gradle check
        env:
          IRAMIX_ENGINE_PROBE: ${{ github.workspace }}/${{ matrix.engine_probe }}

      - name: Build and test Java UI and engine handshake (Xvfb)
        # gpuSpike opens a real SkiaLayer window; Linux runners have no
        # display by default, unlike the Windows/macOS hosted sessions.
        if: runner.os == 'Linux'
        run: xvfb-run -a gradle check
        env:
          IRAMIX_ENGINE_PROBE: ${{ github.workspace }}/${{ matrix.engine_probe }}

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        preset:
          - sanitizers
          - thread-sanitizer

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JACK development package
        run: sudo apt-get update && sudo apt-get install -y libjack-jackd2-dev

      - name: Configure sanitizer
        run: cmake --preset ${{ matrix.preset }}

      - name: Build sanitizer
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test sanitizer
        run: ctest --preset ${{ matrix.preset }} --verbose
