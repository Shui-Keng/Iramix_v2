plugins {
    id "application"
}

def skikoVersion = "0.150.1"
def kotlinStdlibVersion = "2.3.20"
def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def architecture = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def supportedSkikoTargets = [
    "windows-x64",
    "macos-arm64",
    "macos-x64",
    "linux-arm64",
    "linux-x64",
] as Set

def detectedSkikoTarget
if (osName.contains("win") && architecture.contains("64")) {
    detectedSkikoTarget = "windows-x64"
} else if (osName.contains("mac") && architecture.contains("aarch64")) {
    detectedSkikoTarget = "macos-arm64"
} else if (osName.contains("mac") && architecture.contains("64")) {
    detectedSkikoTarget = "macos-x64"
} else if (osName.contains("linux") && architecture.contains("aarch64")) {
    detectedSkikoTarget = "linux-arm64"
} else if (osName.contains("linux") && architecture.contains("64")) {
    detectedSkikoTarget = "linux-x64"
}
def skikoTarget = providers.gradleProperty("iramixSkikoTarget")
    .getOrNull() ?: detectedSkikoTarget
if (!supportedSkikoTargets.contains(skikoTarget)) {
    throw new GradleException(
        "Unsupported desktop target: ${skikoTarget}; "
            + "host=${osName}/${architecture}"
    )
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = "com.iramix.ui.IramixDesktop"
}

dependencies {
    implementation "org.jetbrains.skiko:skiko-awt:${skikoVersion}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlinStdlibVersion}"
    runtimeOnly(
        "org.jetbrains.skiko:skiko-awt-runtime-${skikoTarget}:${skikoVersion}"
    )
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
}

tasks.register("architectureSmoke", JavaExec) {
    group = "verification"
    description = "Verifies the Java/C++ handshake contract."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.iramix.ui.tools.ArchitectureSmoke"
    providers.gradleProperty("iramixEngineProbe").getOrNull()?.with {
        environment "IRAMIX_ENGINE_PROBE", rootProject.file(it).absolutePath
    }
}

tasks.register("ipcLoadTest", JavaExec) {
    group = "verification"
    description = "Measures 1,000 IPC commands under dummy Skia UI load."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.iramix.ui.tools.IpcLoadTest"
    providers.gradleProperty("iramixEngineProbe").getOrNull()?.with {
        environment "IRAMIX_ENGINE_PROBE", rootProject.file(it).absolutePath
    }
}

tasks.register("rasterSpike", JavaExec) {
    group = "verification"
    description = "Compares Skia raster captures against committed " +
        "baselines and measures frame time at four display scales."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.iramix.ui.tools.RasterSpike"
    // No window is opened: the spike renders into an off-screen raster
    // surface, so it must run on headless CI unchanged.
    systemProperty "java.awt.headless", "true"
    environment "IRAMIX_SKIKO_TARGET", skikoTarget
    environment(
        "IRAMIX_RASTER_BASELINES",
        file("baselines").absolutePath
    )
    def baselineMode = providers
        .gradleProperty("iramixRasterBaselines")
        .getOrNull()
    if (baselineMode == "write") {
        environment "IRAMIX_RASTER_BASELINE_MODE", "write"
    }
}

tasks.register("gpuSpike", JavaExec) {
    group = "verification"
    description = "Measures dense-arrangement frame time on Skiko's " +
        "hardware-accelerated SkiaLayer and records the GPU backend " +
        "actually selected."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.iramix.ui.tools.GpuSpike"
    // Unlike rasterSpike, this opens a real window and needs a real
    // (or virtual, e.g. Xvfb) display; it must not force headless.
    environment "IRAMIX_SKIKO_TARGET", skikoTarget
}

tasks.register("gpuRecoverySpike", JavaExec) {
    group = "verification"
    description = "Continuously renders while resizing a SkiaLayer " +
        "window and moving it across real monitors when available."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.iramix.ui.tools.GpuRecoverySpike"
    environment "IRAMIX_SKIKO_TARGET", skikoTarget
}

tasks.register("gpuContextRecoverySpike", JavaExec) {
    group = "verification"
    description = "Disposes and recreates Skiko backend contexts as " +
        "a deterministic proxy for context loss, not literal sleep/wake."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.iramix.ui.tools.GpuContextRecoverySpike"
    environment "IRAMIX_SKIKO_TARGET", skikoTarget
}

tasks.named("ipcLoadTest") {
    mustRunAfter("architectureSmoke")
}

tasks.named("gpuRecoverySpike") {
    mustRunAfter("gpuSpike")
}

tasks.named("gpuContextRecoverySpike") {
    mustRunAfter("gpuRecoverySpike")
}

tasks.named("check") {
    dependsOn(
        "architectureSmoke",
        "ipcLoadTest",
        "rasterSpike",
        "gpuSpike",
        "gpuRecoverySpike",
        "gpuContextRecoverySpike"
    )
}

dependencyLocking {
    lockAllConfigurations()
    lockFile = file("gradle-${skikoTarget}.lockfile")
}
